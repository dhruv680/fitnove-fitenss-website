services:
  - type: web
    name: fitnova-gym-saas
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fitnova.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4


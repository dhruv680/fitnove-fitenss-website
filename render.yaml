services:
  - type: web
    name: fitnova-gym-saas
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fitnova.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: WEB_CONCURRENCY
        value: 4


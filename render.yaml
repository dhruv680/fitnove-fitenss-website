databases:
  - name: fitnova-postgres
    databaseName: fitnova_db
    user: postgres
    plan: free

services:
  - type: web
    name: fitnova-gym-saas
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_fitnova && gunicorn fitnova.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: "/healthz/"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitnova-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: WEB_CONCURRENCY
        value: 4
      - key: FACE_BIOMETRIC_ENCRYPTION_KEY
        value: fvHuozAxdxYH5iTfbAaSpXrEw3xPOniTy8wbrQgSHE8=


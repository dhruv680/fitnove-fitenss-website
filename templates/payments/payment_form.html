{% extends 'base.html' %}

{% block title %}Record Payment – FitNova{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1">Record Member Payment</h3>
        <p class="text-muted small mb-0">Collect membership subscription dues, renew pass, and issue invoice.</p>
      </div>
      <a href="{% url 'payments:payment_list' %}" class="btn btn-fn-outline">
        <i data-lucide="arrow-left" style="width: 16px;"></i>
        <span>Payments</span>
      </a>
    </div>

    <div class="fn-card">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="fn-form-label">Select Gym Member <span class="text-danger">*</span></label>
          <select name="member_id" class="fn-select" required>
            <option value="">-- Choose Athlete --</option>
            {% for m in members %}
            <option value="{{ m.id }}" {% if preselected_member == m.id|stringformat:"s" %}selected{% endif %}>
              {{ m.full_name }} ({{ m.member_id }}) – {{ m.phone }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label class="fn-form-label">Membership Plan <span class="text-danger">*</span></label>
          <select name="plan_id" id="planSelect" class="fn-select" required onchange="setAmount(this)">
            <option value="">-- Select Subscription Tier --</option>
            {% for p in plans %}
            <option value="{{ p.id }}" data-price="{{ p.price }}">
              {{ p.name }} – {{ p.organization.currency }}{{ p.price }} ({{ p.get_duration_type_display }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="fn-form-label">Amount ({{ current_org.currency|default:'$' }}) <span class="text-danger">*</span></label>
            <input type="number" step="0.01" name="amount" id="paymentAmountInput" class="fn-input" required placeholder="0.00">
          </div>
          <div class="col-md-6">
            <label class="fn-form-label">Payment Method <span class="text-danger">*</span></label>
            <select name="payment_method" class="fn-select" required>
              <option value="UPI">UPI / QR Code Scan</option>
              <option value="CASH">Cash at Desk</option>
              <option value="CREDIT_CARD">Credit Card</option>
              <option value="DEBIT_CARD">Debit Card</option>
              <option value="NET_BANKING">Net Banking</option>
              <option value="ONLINE">Online Portal</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="fn-form-label">Reference / Transaction ID (Optional)</label>
          <input type="text" name="transaction_id" class="fn-input" placeholder="Leave blank to auto-generate unique TXN code">
        </div>

        <div class="mb-4">
          <label class="fn-form-label">Payment Notes</label>
          <input type="text" name="notes" class="fn-input" placeholder="Annual renewal or desk collection notes">
        </div>

        <div class="text-end">
          <a href="{% url 'payments:payment_list' %}" class="btn btn-fn-outline me-2">Cancel</a>
          <button type="submit" class="btn btn-fn-accent">
            <i data-lucide="check" style="width: 16px;"></i>
            <span>Confirm Payment & Generate Invoice</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function setAmount(selectEl) {
    const opt = selectEl.options[selectEl.selectedIndex];
    const price = opt.getAttribute('data-price');
    if (price) {
      document.getElementById('paymentAmountInput').value = price;
    }
  }
</script>
{% endblock %}
